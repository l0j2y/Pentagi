# SiliconFlow 混搭角色配置（custom provider）
#
# 策略：执行准 + 轻量省 + 报告强
# - DeepSeek V4 Pro：高强度推理组（编排/计划/导师/编码/渗透执行）
# - Qwen3.6-35B-A3B（MoE 3B 激活）：轻量工具人组（搜索/富化/反思/结构化）
# - GLM-5.2：最终报告组（simple 角色承担 GetTaskResult 终报告 + 标题摘要）
#
# 价格取官方定价近似值，仅用于成本统计展示。

# ============ 高强度推理组：DeepSeek V4 Pro ============

primary_agent:
  model: deepseek-ai/DeepSeek-V4-Pro
  n: 1
  max_tokens: 16384
  price:
    input: 0.435
    output: 0.87
    cache_read: 0.003625

