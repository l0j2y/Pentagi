# Ollama local qwen3:8b-nothink agent configuration.
#
# All roles mapped to qwen3:8b-nothink: qwen3:8b (Q4_K_M, 8.2B, qwen3 family)
# with thinking force-disabled at the model template level
# (see Modelfile.qwen3-nothink). PentAGI never sends the Ollama "think"
# field, and Ollama 0.34 defaults think=TRUE for thinking-capable models;
# stock qwen3:8b therefore spends 20-120s+ thinking on the simple
# image/language/title chooser calls during flow creation, blowing the
# frontend ~46s request timeout. All roles use the same derived model on
# purpose: simple/simple_json are also used mid-run (summarizer, reporter,
# tool-call fixer), so mixing tags would thrash the single 8GB VRAM slot
# with 3-6s model reloads.
# Temperature strategy follows example.ollama.provider.yml (low temp for
# determinism on small models, slightly higher for creative roles).

simple:
  model: "qwen3:8b-nothink"
  temperature: 0.2
  top_p: 0.3
  n: 1
  max_tokens: 4000

simple_json:
  model: "qwen3:8b-nothink"
  temperature: 0.1
  top_p: 0.2
  n: 1
  max_tokens: 4000
  json: true

primary_agent:
  model: "qwen3:8b-nothink"
  temperature: 0.2
  top_p: 0.3
  n: 1
  max_tokens: 4000

